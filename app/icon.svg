<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Call Center Outsourced logo</title>
  <desc id="desc">A custom outsourced call center queue mark with a CCX wordmark monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082f49"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#082f49" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="34" fill="#fff8ee"/>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(16 8) scale(1)">
  <path d="M28 35c0-8 7-15 16-15h8c9 0 16 7 16 15v7" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  <rect x="20" y="42" width="16" height="24" rx="8" fill="#f59e0b"/>
  <rect x="60" y="42" width="16" height="24" rx="8" fill="#f59e0b"/>
  <path d="M64 66c-5 8-15 11-28 9" fill="none" stroke="#fff8ee" stroke-width="5" stroke-linecap="round"/>
  <circle cx="36" cy="75" r="4" fill="#0ea5e9"/>
  </g>
  <rect x="18" y="88" width="92" height="25" rx="12.5" fill="rgba(0,0,0,.24)"/>
  <text x="64" y="106" text-anchor="middle" font-family="Inter, Manrope, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="-.5" fill="#fff8ee">CCX</text>
</svg>
